# H2 is a file-based database that needs no installation.
# It saves its data into ./data/campusdb automatically.
spring.datasource.url=jdbc:h2:file:./data/campusdb
spring.datasource.username=sa
spring.datasource.password=

# This makes Spring look at your Java classes in model/ and automatically
# build matching database tables for you. You never write CREATE TABLE.
spring.jpa.hibernate.ddl-auto=update

# Render sets the PORT variable; locally we fall back to 8000
server.port=${PORT:8000}

# Binds to every network interface on this laptop (not just "localhost"),
# which is what lets OTHER laptops on the same WiFi reach this app —
# see the README for the step-by-step presentation setup.
server.address=0.0.0.0

# Allow photo uploads up to 10MB each.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
