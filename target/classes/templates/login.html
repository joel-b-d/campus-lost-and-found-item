<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="bg-carousel">
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
</div>

<div class="container" style="margin-top:80px;">
    <h2>Campus Lost &amp; Found - Login</h2>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <!-- This form sends its two fields to AuthController's doLogin() method -->
    <form th:action="@{/login}" method="post">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Sign In</button>
    </form>

    <p style="margin-top:16px;">
        New student? <a th:href="@{/register}">Create an account</a>
    </p>

    <p style="font-size:13px;">
        Using a phone or another laptop? <a th:href="@{/connect}">Show the connect QR code</a>
    </p>

    <p style="font-size:12px;color:#888;margin-top:20px;">
        Demo logins — admin@saintgits.org / admin123,
        staff@saintgits.org / staff123, johan@saintgits.org / student123
    </p>
</div>
</body>
</html>
